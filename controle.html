<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controle · A Trilha do Corretor</title>
<link rel="stylesheet" href="/estilo.css">
<style>
  main { max-width: 640px; margin: 0 auto; padding: 16px 14px 40px; }
  h1 { font-family: var(--serif); font-weight: normal; font-size: 24px; margin: 4px 0 14px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--suave); margin: 22px 0 8px; }
  .cartao { background: var(--fundo2); border: 1px solid var(--linha); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .agora { font-size: 20px; font-weight: 700; }
  .depois { color: var(--suave); font-size: 14px; margin-top: 4px; }
  .linha { display: flex; gap: 8px; flex-wrap: wrap; }
  .linha > * { flex: 1; }
  button.b { padding: 14px 10px; border-radius: 10px; border: 1px solid var(--linha); background: #1d2330; color: var(--texto); font-weight: 600; font-size: 15px; }
  button.prim { background: var(--vermelho); border-color: var(--vermelho); color: #fff; font-size: 19px; padding: 18px; width: 100%; margin-bottom: 8px; }
  button.verde { background: #1f5e45; border-color: #2c8a64; }
  .status { display: flex; justify-content: space-between; font-size: 15px; margin-top: 10px; font-variant-numeric: tabular-nums; }
  .status b { color: var(--ambar); }
  select, input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--linha); background: #1d2330; color: var(--texto); font-size: 15px; }
  .jog { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--linha); font-size: 15px; }
  .jog:first-child { border-top: 0; }
  .jog button { padding: 4px 10px; border-radius: 8px; border: 1px solid var(--linha); background: transparent; color: #ff8a95; }
  .msg { min-height: 20px; color: #ff8a95; margin-top: 6px; }
  .login { padding-top: 15vh; }
  a { color: var(--ambar); }
</style>
</head>
<body>
<main id="tela"></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let senha = localStorage.getItem('trilha_senha') || '';
let E = null, recebidoEm = 0, es = null;

function login(msg) {
  $('#tela').innerHTML = `<div class="login">
    <h1>Controle do professor</h1>
    <input id="iSenha" type="password" placeholder="Senha" autocomplete="current-password">
    <button class="b prim" id="bOk" style="margin-top:10px">Entrar</button>
    <div class="msg">${esc(msg || '')}</div></div>`;
  $('#bOk').onclick = () => { senha = $('#iSenha').value; localStorage.setItem('trilha_senha', senha); conectar(); };
  $('#iSenha').onkeydown = ev => { if (ev.key === 'Enter') $('#bOk').click(); };
}

function conectar() {
  if (es) es.close();
  es = new EventSource('/eventos?tipo=controle&senha=' + encodeURIComponent(senha));
  let recebeu = false;
  es.onmessage = ev => { recebeu = true; E = JSON.parse(ev.data); recebidoEm = Date.now(); render(); };
  es.onerror = () => { if (!recebeu) { es.close(); login(senha ? 'Senha errada.' : ''); } };
}

async function acao(a, extra = {}) {
  const r = await fetch('/api/controle', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ senha, acao: a }, extra)) });
  const d = await r.json().catch(() => ({}));
  const m = $('#msg'); if (m) m.textContent = d.erro || '';
}

let chaveTela = null;
function render() {
  const e = E, r = e.rodada;
  const aberta = r && r.aberta;
  const chave = JSON.stringify([e.etapa, aberta, r && r.cena, r && r.pausado, e.relogio, e.qr, e.jogadores.length, e.jogadores.map(j => j.pontos).join(), e.palpites, r && r.terminaram]);
  if (chave === chaveTela) { vivo(); return; }
  const foco = document.activeElement;
  if (foco && (foco.tagName === 'INPUT' || foco.tagName === 'SELECT') && chaveTela && JSON.parse(chaveTela)[0] === e.etapa) { vivo(); return; }
  chaveTela = chave;
  let prox = 'Próximo ▶';
  if (r && r.cena) prox = '✉️ Abrir a prova (rodada ' + r.n + ')';
  else if (aberta) prox = 'Fechar rodada agora ■';
  else if (e.proximaNome) prox = 'Próximo: ' + e.proximaNome + ' ▶';

  $('#tela').innerHTML = `
    <h1>Controle · A Trilha do Corretor</h1>
    <div class="cartao">
      <div class="agora">${esc(e.etapaNome)}</div>
      <div class="depois">Etapa ${e.etapa + 1} de ${e.etapas.length}${e.tipo === 'lobby' ? ' · peça para todos entrarem pelo QR' : ''}${e.tipo === 'palpite' ? ` · ${e.palpites} palpites` : ''}</div>
      ${r ? `<div class="status"><span id="crono">${aberta ? '' : (r.cena ? '📖 Cena de chegada: leia em voz alta' : 'Rodada fechada')}</span><span id="prog"></span></div>` : ''}
    </div>
    <button class="b prim" id="bProx">${esc(prox)}</button>
    ${aberta ? `<div class="linha">
      <button class="b" id="bPausa">${r.pausado ? '▶ Retomar' : '⏸ Pausar'}</button>
      <button class="b" id="b30">+30 s</button>
      <button class="b" id="bPular">Pular rodada</button>
    </div>` : `<div class="linha"><button class="b" id="bVoltar">◀ Voltar uma etapa</button></div>`}
    <div class="msg" id="msg"></div>

    <h2>Fôlego do professor: ${e.relogio} min</h2>
    <div class="linha">
      <button class="b" id="bRelMenos">−5 min</button>
      <button class="b" id="bRelMais">+5 min</button>
      <button class="b" id="bQr">${e.qr ? 'Esconder QR' : 'Mostrar QR'}</button>
    </div>

    <h2>Ir para uma etapa</h2>
    <select id="sEtapa">${e.etapas.map(x => `<option value="${x.i}" ${x.i === e.etapa ? 'selected' : ''}>${x.i + 1}. ${esc(x.nome)}</option>`).join('')}</select>
    <button class="b" id="bIr" style="width:100%;margin-top:8px">Ir para a etapa escolhida</button>

    <h2>Jogadores (${e.jogadores.length})</h2>
    <div class="cartao">${e.jogadores.length ? e.jogadores.map(j => `<div class="jog"><span>${j.posicao}º ${esc(j.nome)} · <b style="color:var(--ambar)">${j.pontos}</b> <small style="color:var(--suave)">${j.acertos}/${j.respondidas}</small></span><button data-id="${j.id}">remover</button></div>`).join('') : '<span style="color:var(--suave)">Ninguém entrou ainda.</span>'}</div>

    <h2>Telas</h2>
    <div class="cartao" style="font-size:14px;line-height:1.7">
      Telão: <a href="/telao" target="_blank">/telao</a><br>
      Celular dos alunos: <a href="/" target="_blank">/</a> (pelo QR do telão)<br>
      Relatório da turma: <a href="/turma?senha=${encodeURIComponent(senha)}" target="_blank">abrir</a>
    </div>

    <h2>Manutenção</h2>
    <div class="linha"><input id="iZerar" placeholder="Digite ZERAR"><button class="b" id="bZerar">Zerar jogo</button></div>
  `;
  $('#bProx').onclick = () => acao('proximo');
  if ($('#bPausa')) $('#bPausa').onclick = () => acao(r.pausado ? 'retomar' : 'pausar');
  if ($('#b30')) $('#b30').onclick = () => acao('mais30');
  if ($('#bPular')) $('#bPular').onclick = () => { if (confirm('Pular esta rodada? Ninguém perde nem ganha pontos nela.')) acao('pular'); };
  if ($('#bVoltar')) $('#bVoltar').onclick = () => acao('anterior');
  $('#bRelMenos').onclick = () => acao('relogioMenos');
  $('#bRelMais').onclick = () => acao('relogioMais');
  $('#bQr').onclick = () => acao('qr');
  $('#bIr').onclick = () => { if (confirm('Ir para a etapa escolhida?')) acao('irPara', { indice: Number($('#sEtapa').value) }); };
  $('#bZerar').onclick = () => acao('zerar', { confirmacao: $('#iZerar').value.trim() });
  document.querySelectorAll('.jog button').forEach(b => b.onclick = () => { if (confirm('Remover este jogador?')) acao('remover', { id: b.dataset.id }); });
  vivo();
}
function vivo() {
  const r = E && E.rodada;
  if (!r) return;
  const c = $('#crono'), p = $('#prog');
  if (r.aberta && c) {
    const rest = Math.max(0, r.restante - (r.pausado ? 0 : Date.now() - recebidoEm));
    const s = Math.ceil(rest / 1000);
    c.innerHTML = r.pausado ? '⏸ <b>Pausado</b>' : `⏳ <b>${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}</b>`;
  }
  if (p) p.innerHTML = `<b>${r.terminaram}</b> de ${r.jogadores} votaram`;
}
setInterval(vivo, 500);

if (senha) conectar(); else login();
</script>
</body>
</html>
